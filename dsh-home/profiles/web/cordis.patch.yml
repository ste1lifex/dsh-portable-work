# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# DSH 便携版：本 profile 只挂载随包插件（见下）

# PDF reading is provided by dsh-pdf-reader (host-only, CPU-only, no config needed):
# PyMuPDF extracts the text layer and renders figures/tables/formulas as
# high-DPI PNG region crops into <workspace>\.dsh-pdf-reader, which the vision
# model reads with read_image. It ships no runtime; the only external
# requirement is a system Python 3 with `pymupdf` (see start-dsh.ps1, which
# reports readiness on every launch). Its bundle patch adds the three tools
# (pdf_scan / pdf_read_page / pdf_render_region) on its own, so nothing is
# inserted in this file.

# dsh-computer-use-win: the bundle's own patch locates the MCP server with
# `new URL('mcp/server.mjs', baseUrl)`, assuming baseUrl is the patch file's
# directory. On DSH 0.1.5-rc.1 the Loader anchors baseUrl at the PROFILE
# directory instead (see @deepseek-ai/dsh/lib/profile-boot-*.js), so it
# resolved to profiles/web/mcp/server.mjs -> MODULE_NOT_FOUND, the stdio
# server crash-looped, and no mcp__wincu__* tools ever appeared.
# Patch semantics assign `config` wholesale (no deep merge), so the corrected
# row repeats every key; args is re-anchored to the profile directory.
- id: mcp-dsh-computer-use-win
  config:
    serverName: wincu
    transport: stdio
    command: !!js process.execPath
    args:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new
        URL('node_modules/dsh-computer-use-win/mcp/server.mjs', baseUrl))"
    toolCallTimeoutMs: 60000
    failOnStartupError: false

# dsh-latex: self-contained LaTeX (latex_health / latex_compile / latex_math).
# The pinned Tectonic engine lives outside the plugin package, under
# dsh-home\runtimes（唯一随包的运行时）。
# runtimeDir is resolved at mount time from DSH_HOME (set by
# start-dsh.ps1 / dsh.cmd), so the whole portable folder can be moved to another
# path or machine without editing this file. Patch semantics assign `config`
# wholesale, so every key the bundle declared is repeated here.
- id: dsh-latex
  config:
    runtimeDir: !!js "process.env.DSH_HOME + '/runtimes/latex-runtime-' +
      process.platform + '-' + process.arch"
    allowedLocalRoots: []
    offline: false
    allowShellEscape: false
    defaultTimeoutMs: 180000
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: system
- id: locale
  name: "@deepseek-ai/dsh-client-locale"
  config:
    preference: zh
